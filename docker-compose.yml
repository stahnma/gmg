services:
  emulator:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    ports:
      - "8080:8080/udp"

  gmg:
    build: .
    ports:
      - "3000:80"
    environment:
      - GMG_GRILL_HOST=emulator
      - GMG_GRILL_PORT=8080
    volumes:
      - gmg-data:/data
    depends_on:
      - emulator

volumes:
  gmg-data:
